

spring.application.name=skillswap-backend-test
spring.datasource.url=jdbc:h2:mem:skillswap_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.jwt.secret=SkillSwapUltraSecureJwtSecretKeyMustBeAtLeast256BitsLongForHMACSHA256Signature2026
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=http://localhost:5173
